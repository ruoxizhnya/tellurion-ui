name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint / typecheck / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      # Node 22：eslint 10 要求 ^20.19.0 || ^22.13.0 || >=24，vitest 4 要求
      # >=20.19；用 22 这档 LTS 覆盖两者。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 用 ci 而不是 install：lockfile 不同步时直接失败，而不是悄悄改依赖树。
      - name: Install
        run: npm ci

      # eslint 目前是 0 error / 大量 warning，退出码 0；这里只守 error。
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # `npm test` 内部先跑 lint:tests（vitest toBe(expected, "message") 误用的
      # 静态扫描），再跑 vitest。
      - name: Test
        run: npm test

  e2e:
    name: Playwright e2e (smoke)
    runs-on: ubuntu-latest
    # ⚠️ 注释与触发器对不上，已按实测订正（2026-10-26）。原文写「此 job 先保留为手动触发
    # （workflow_dispatch），待后端服务的 CI 就绪后改为自动」——两条都不成立：
    #   ① 文件头的 `on:` 只有 `push: branches [main]` 与 `pull_request`，**没有 workflow_dispatch**，
    #      所以这个 job 每次 push / PR 都会跑，不是手动；
    #   ② 这个 job 今天**没有任何 playwright 步骤**——只有 checkout + setup-node + `npm ci`（见下面），
    #      等于「e2e 依赖装得起来」这一条烟雾，不跑用例，因此也不会因为后端没起而红。
    # 真实状态：端到端用例打真后端（:5173 / data :8081 / analysis :8085），CI 里没有栈，故**故意不启用**。
    # 起栈见 `tellurion-docs:docs/TEST.md`（注意：core 仓没有 docs/TEST.md，文档拆仓后它在 docs 仓——原注释指错了地方）。
    # 要真跑：加 services 或改 `workflow_dispatch` + 输入 API_BASE，且红必须先进 `docs/TASKS.md` AUD-61 的登记表，
    # 不许靠放宽断言变绿。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install
        working-directory: e2e
        run: npm ci
      # 冒烟前需后端在跑（API_BASE 指向已起的 analysis-service）。未起则此步
      # 失败，故不默认启用——见上面注释。
